name: Update Free Nodes

on:
  schedule:
    # 每天 22:00 UTC = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "aggregator.py"
      - "config.yaml"
      - ".github/workflows/update.yml"

# 允许把生成结果提交回仓库
permissions:
  contents: write

# 同一时间只跑一个,避免互相覆盖
concurrency:
  group: update-free-nodes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Aggregate / test / build subscriptions
        run: python aggregator.py --config config.yaml --out output
        continue-on-error: true

      - name: Show meta
        run: cat output/meta.json || true

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: update free nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
