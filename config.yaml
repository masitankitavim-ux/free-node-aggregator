# ============================================================
# Free Node Aggregator 配置
# ============================================================

output:
  max_nodes: 600          # 最终保留节点数上限(按延迟从快到慢截断)
  max_latency_ms: 3000    # 延迟超过该值的节点直接丢弃
  min_nodes: 20           # 少于该数量视为异常(CI 里会以退出码 1 报警)

test:
  enabled: true
  mode: mihomo            # mihomo = 真发请求穿过节点(推荐) | tcp = 只测 TCP 连接(不可靠)
  mihomo_bin: mihomo      # PATH 里的名字或绝对路径
  mihomo_url: http://www.gstatic.com/generate_204   # 穿透测试目标
  mihomo_timeout_ms: 3000 # 单节点穿透超时
  tcp_prefilter: true    # 先用 TCP 快速预筛,再对存活的做真穿透
  single_concurrency: 64  # 逐节点测速并发数
  batch: 100              # 每批多少个节点交给一个 mihomo 实例
  controller_port: 9099
  mixed_port: 7899
  # --- 下面是 tcp 模式参数 ---
  timeout: 2.0
  attempts: 1
  concurrency: 128
  keep_udp: true

mark:
  prefix: true            # 节点名加 "[国旗 地区 | 延迟 | 来源-序号]" 前缀
  latency_tiers:          # 延迟分级(ms),决定 🟢🟡🟠🔴
    fast: 300
    good: 800
    ok: 1500

# ------------------------------------------------------------
